name: CI

on:
  push:
    branches: [main, arcade-10min]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:smoke
      - run: npm run test:meeting-smoke
      - run: npm run test:committee-smoke
      - run: npm run test:continuity-smoke
      - run: npm run test:session-smoke
      - run: npm run test:persistence-smoke
      - run: npm run test:arcade-smoke
      - run: npm run test
      - run: npm run build
